<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dashboard cuaca: kondisi terkini, prakiraan, kualitas udara, dan riwayat cuaca.">
  <title>Dashboard | Weather Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">

  <!-- CSS bersama (urutan jangan diubah) -->
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <!-- CSS khusus halaman -->
  <link rel="stylesheet" href="assets/css/pages/home.css">
</head>
<body>
  <header id="app-header"></header>

  <main id="app">
    <div class="page-header">
      <h1 class="page-header__title">Dashboard Cuaca</h1>
      <p class="page-header__subtitle" id="page-subtitle">Memuat lokasi…</p>
    </div>

    <div class="home-top">
      <section class="card hero" id="weather-current" aria-label="Cuaca saat ini"></section>
      <section class="card" id="air-quality-summary" aria-label="Ringkasan kualitas udara"></section>
    </div>

    <section class="section" aria-labelledby="days-title">
      <div class="section__header">
        <h2 id="days-title">3 Hari ke Depan</h2>
        <a class="btn btn--ghost" data-link="forecast" href="#">Prakiraan lengkap →</a>
      </div>
      <div id="forecast-summary"></div>
    </section>

    <section class="section" aria-labelledby="features-title">
      <div class="section__header">
        <h2 id="features-title">Jelajahi Fitur</h2>
      </div>
      <div class="grid grid--3" id="feature-links"></div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script type="module" src="assets/js/pages/home.js"></script>
</body>
</html>
